<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokumen Cetak Resmi - RodaKita Rental Mobil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: #1e293b;
      background: #f1f5f9;
      padding: 30px 16px;
      font-size: 13px;
      line-height: 1.6;
    }
    .print-sheet {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border: 1px solid #cbd5e1;
      padding: 40px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      border-radius: 6px;
    }
    .no-print-bar {
      max-width: 800px;
      margin: 0 auto 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn {
      padding: 8px 16px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      border: none;
    }
    .btn-print { background: #0284c7; color: white; }
    .btn-close { background: #e2e8f0; color: #334155; }

    /* Kop Surat */
    .letterhead {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 14px;
      margin-bottom: 24px;
    }
    .brand-name {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
    }
    .brand-name span { color: #0284c7; }
    .brand-sub { font-size: 11px; color: #64748b; }
    .doc-title-block { text-align: right; }
    .doc-type-title {
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      color: #0f172a;
    }
    .doc-number { font-size: 13px; font-weight: 700; color: #0284c7; }

    .grid-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    .info-box h4 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 6px;
    }

    table.doc-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
    }
    table.doc-table th {
      background: #f8fafc;
      border-top: 1px solid #cbd5e1;
      border-bottom: 2px solid #cbd5e1;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      text-align: left;
    }
    table.doc-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 12px;
    }
    .text-right { text-align: right; }

    .signatures {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-top: 50px;
      text-align: center;
    }
    .sig-line {
      margin-top: 70px;
      border-bottom: 1px solid #0f172a;
      display: inline-block;
      min-width: 180px;
    }

    @media print {
      body { background: white; padding: 0; }
      .no-print-bar { display: none; }
      .print-sheet { border: none; box-shadow: none; padding: 0; }
    }
  </style>
</head>
<body>

  <div class="no-print-bar">
    <button class="btn btn-close" onclick="window.close()">Tutup Jendela</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ Cetak Dokumen / Simpan PDF</button>
  </div>

  <div class="print-sheet" id="printContent">
    <div style="text-align:center; padding:50px 0; color:#64748b;">Menyiapkan dokumen...</div>
  </div>

  <script>
    const formatRp = (n) => 'Rp ' + Math.round(n || 0).toLocaleString('id-ID');

    window.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const type = urlParams.get('type') || 'invoice';
      const id = urlParams.get('id');

      if (!id) return alert('ID dokumen tidak disertakan.');

      try {
        if (type === 'payroll') {
          // Render Slip Gaji
          const res = await fetch('/api/payroll');
          const list = await res.json();
          const p = list.find(x => x.id == id);
          if (!p) return alert('Data slip gaji tidak ditemukan.');
          renderSlipGaji(p);
        } else {
          // Render Invoice / Kuitansi / SPK
          const res = await fetch(`/api/documents/print/${type}/${id}`);
          const data = await res.json();
          if (type === 'invoice') renderInvoice(data);
          else if (type === 'kuitansi') renderKuitansi(data);
          else if (type === 'spk') renderSPK(data);
        }
      } catch (err) {
        document.getElementById('printContent').innerHTML = '<div style="color:red; text-align:center;">Gagal memuat data dokumen.</div>';
      }
    });

    // 1. INVOICE RESMI
    function renderInvoice(d) {
      const o = d.order;
      document.title = `Invoice_${o.kode_booking}`;
      document.getElementById('printContent').innerHTML = `
        <div class="letterhead">
          <div>
            <div class="brand-name">Roda<span>Kita</span> Rental</div>
            <div class="brand-sub">${d.perusahaan.alamat}<br>Telp: ${d.perusahaan.kontak}</div>
          </div>
          <div class="doc-title-block">
            <div class="doc-type-title">INVOICE SEWA</div>
            <div class="doc-number">No: INV/${o.kode_booking}</div>
            <div style="font-size:11px; color:#64748b;">Tanggal: ${d.tanggal_cetak}</div>
          </div>
        </div>

        <div class="grid-info">
          <div class="info-box">
            <h4>Ditagihkan Kepada:</h4>
            <b>${o.nama_customer}</b><br>
            No. WhatsApp: ${o.nomor_wa}<br>
            Alamat: ${o.alamat_customer || '-'}<br>
            Kota Tujuan: ${o.tujuan || '-'}
          </div>
          <div class="info-box" style="text-align:right;">
            <h4>Jadwal Pemakaian:</h4>
            Tanggal: <b>${o.tanggal_mulai} s/d ${o.tanggal_selesai}</b> (${o.durasi_hari} Hari)<br>
            Kendaraan: <b>${o.nama_mobil} (${o.nomor_polisi})</b><br>
            Layanan: <b>${o.opsi_sopir ? 'Dengan Sopir (' + o.nama_sopir + ')' : 'Lepas Kunci'}</b>
          </div>
        </div>

        <table class="doc-table">
          <thead>
            <tr>
              <th>Deskripsi Layanan</th>
              <th class="text-right">Tarif Satuan</th>
              <th class="text-right">Durasi</th>
              <th class="text-right">Subtotal</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Sewa Unit Kendaraan: <b>${o.nama_mobil}</b></td>
              <td class="text-right">${formatRp(o.biaya_mobil / o.durasi_hari)}</td>
              <td class="text-right">${o.durasi_hari} Hari</td>
              <td class="text-right">${formatRp(o.biaya_mobil)}</td>
            </tr>
            ${o.opsi_sopir ? `
              <tr>
                <td>Jasa Sopir Profesional (${o.nama_sopir || 'Pengemudi'})</td>
                <td class="text-right">${formatRp(o.biaya_sopir / o.durasi_hari)}</td>
                <td class="text-right">${o.durasi_hari} Hari</td>
                <td class="text-right">${formatRp(o.biaya_sopir)}</td>
              </tr>
            ` : ''}
            ${o.biaya_tambahan ? `
              <tr>
                <td>Biaya Tambahan / Antar-Jemput</td>
                <td class="text-right">-</td>
                <td class="text-right">-</td>
                <td class="text-right">${formatRp(o.biaya_tambahan)}</td>
              </tr>
            ` : ''}
            ${o.diskon ? `
              <tr>
                <td>Potongan Diskon Promosi</td>
                <td class="text-right">-</td>
                <td class="text-right">-</td>
                <td class="text-right" style="color:red;">-${formatRp(o.diskon)}</td>
              </tr>
            ` : ''}
          </tbody>
          <tfoot>
            <tr>
              <th colspan="3" class="text-right">TOTAL TAGIHAN</th>
              <th class="text-right" style="font-size:14px; color:#0284c7;">${formatRp(o.total_harga)}</th>
            </tr>
            <tr>
              <td colspan="3" class="text-right">Uang Muka (DP) Terverifikasi</td>
              <td class="text-right" style="color:green; font-weight:700;">-${formatRp(d.total_terbayar)}</td>
            </tr>
            <tr>
              <th colspan="3" class="text-right" style="font-size:13px; color:#b91c1c;">SISA TAGIHAN PELUNASAN</th>
              <th class="text-right" style="font-size:15px; color:#b91c1c;">${formatRp(d.sisa_tagihan)}</th>
            </tr>
          </tfoot>
        </table>

        <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; padding:12px; font-size:11px; margin-bottom:24px;">
          <b>Informasi Pembayaran Rekening Resmi:</b><br>
          ${d.perusahaan.rekening}<br>
          *Pelunasan wajib diselesaikan sebelum serah terima kunci / pemberangkatan unit.
        </div>

        <div class="signatures">
          <div>
            Penyewa / Customer
            <div class="sig-line"></div>
            ( <b>${o.nama_customer}</b> )
          </div>
          <div>
            Bagian Administrasi Rental
            <div class="sig-line"></div>
            ( <b>RodaKita Rental</b> )
          </div>
        </div>
      `;
    }

    // 2. KUITANSI PEMBAYARAN SAH
    function renderKuitansi(d) {
      const o = d.order;
      document.title = `Kuitansi_${o.kode_booking}`;
      document.getElementById('printContent').innerHTML = `
        <div class="letterhead">
          <div>
            <div class="brand-name">Roda<span>Kita</span> Rental</div>
            <div class="brand-sub">${d.perusahaan.alamat}<br>Telp: ${d.perusahaan.kontak}</div>
          </div>
          <div class="doc-title-block">
            <div class="doc-type-title">KUITANSI RESMI</div>
            <div class="doc-number">No: KWT/${o.kode_booking}</div>
            <div style="font-size:11px; color:#64748b;">Tanggal: ${d.tanggal_cetak}</div>
          </div>
        </div>

        <div style="border:2px solid #0f172a; border-radius:8px; padding:20px; margin-bottom:24px; font-size:13px;">
          <div style="display:grid; grid-template-columns: 160px 1fr; gap:10px; margin-bottom:10px;">
            <div>Telah Terima Dari</div>
            <div>: <b>${o.nama_customer}</b> (${o.nomor_wa})</div>
          </div>
          <div style="display:grid; grid-template-columns: 160px 1fr; gap:10px; margin-bottom:10px;">
            <div>Uang Sejumlah</div>
            <div>: <b style="font-size:16px; color:#0284c7; background:#e0f2fe; padding:4px 10px; border-radius:4px;">${formatRp(d.total_terbayar)}</b></div>
          </div>
          <div style="display:grid; grid-template-columns: 160px 1fr; gap:10px; margin-bottom:10px;">
            <div>Untuk Pembayaran</div>
            <div>: Pembayaran Sewa Mobil <b>${o.nama_mobil} (${o.nomor_polisi})</b> periode ${o.tanggal_mulai} s/d ${o.tanggal_selesai}</div>
          </div>
          <div style="display:grid; grid-template-columns: 160px 1fr; gap:10px;">
            <div>Sisa Tagihan</div>
            <div>: <b>${formatRp(d.sisa_tagihan)}</b> ${d.sisa_tagihan === 0 ? '<span style="color:green; font-weight:bold;">(LUNAS)</span>' : ''}</div>
          </div>
        </div>

        <div class="signatures">
          <div>
            Penyetor / Customer
            <div class="sig-line"></div>
            ( <b>${o.nama_customer}</b> )
          </div>
          <div>
            Diverifikasi oleh Akuntansi
            <div class="sig-line"></div>
            ( <b>Bagian Keuangan & Akuntansi</b> )
          </div>
        </div>
      `;
    }

    // 3. SURAT PERJANJIAN SEWA KENDARAAN (SPK) SESUAI BAB III PROPOSAL
    function renderSPK(d) {
      const o = d.order;
      document.title = `SPK_${o.kode_booking}`;
      document.getElementById('printContent').innerHTML = `
        <div class="letterhead">
          <div>
            <div class="brand-name">Roda<span>Kita</span> Rental</div>
            <div class="brand-sub">${d.perusahaan.alamat}</div>
          </div>
          <div class="doc-title-block">
            <div class="doc-type-title" style="font-size:17px;">SURAT PERJANJIAN SEWA (SPK)</div>
            <div class="doc-number">No: SPK/${o.kode_booking}</div>
            <div style="font-size:11px; color:#64748b;">Tanggal: ${d.tanggal_cetak}</div>
          </div>
        </div>

        <p style="margin-bottom:14px; text-align:justify;">
          Pada hari ini, bertempat di kantor RodaKita Rental Mobil, telah disepakati perjanjian sewa menyewa kendaraan antara pihak Rental Mobil (<b>PIHAK PERTAMA</b>) dengan penyewa (<b>PIHAK KEDUA</b>) dengan ketentuan:
        </p>

        <div style="background:#f8fafc; border:1px solid #cbd5e1; border-radius:6px; padding:14px; margin-bottom:16px; font-size:12px;">
          <b>IDENTITAS PENYEWA (PIHAK KEDUA):</b><br>
          Nama: <b>${o.nama_customer}</b> &nbsp;|&nbsp; WhatsApp: ${o.nomor_wa}<br>
          Alamat: ${o.alamat_customer || '-'}<br><br>
          <b>DATA KENDARAAN & SEWA:</b><br>
          Unit Kendaraan: <b>${o.nama_mobil}</b> (${o.nomor_polisi})<br>
          Masa Sewa: <b>${o.tanggal_mulai} s/d ${o.tanggal_selesai}</b> (${o.durasi_hari} Hari)<br>
          Jenis Sewa: <b>${o.opsi_sopir ? 'Dengan Sopir (' + o.nama_sopir + ')' : 'Lepas Kunci'}</b><br>
          Total Biaya: <b>${formatRp(o.total_harga)}</b>
        </div>

        <h4 style="font-size:12px; margin-bottom:6px; text-transform:uppercase;">Pasal-Pasal Perjanjian (Sesuai Bab III Proposal):</h4>
        <ol style="padding-left:18px; font-size:11px; color:#334155; margin-bottom:24px; line-height:1.7;">
          <li><b>Pemeriksaan Dokumen:</b> Pihak Kedua wajib menunjukkan KTP dan SIM A asli yang masih berlaku sebelum serah kunci.</li>
          <li><b>Batas Waktu Pengembalian:</b> Keterlambatan pengembalian unit dikenakan denda sebesar Rp 50.000,- per jam toleransi 1 jam pertama.</li>
          <li><b>Bahan Bakar (BBM):</b> Unit dikembalikan dalam kondisi posisi bahan bakar yang setara saat serah terima awal (Bar-to-Bar).</li>
          <li><b>Kerusakan & Asuransi:</b> Kerusakan akibat kelalaian penyewa (kecelakaan, lecet bodi) sepenuhnya menjadi tanggung jawab Pihak Kedua sesuai biaya bengkel resmi / klaim asuransi deductible.</li>
          <li><b>Larangan:</b> Dilarang memindahtangankan, menggadaikan, atau menggunakan kendaraan untuk kegiatan melawan hukum.</li>
        </ol>

        <div class="signatures">
          <div>
            PIHAK KEDUA (Penyewa)
            <div class="sig-line"></div>
            ( <b>${o.nama_customer}</b> )
          </div>
          <div>
            PIHAK PERTAMA (Staff Operasional)
            <div class="sig-line"></div>
            ( <b>Staff RodaKita Rental</b> )
          </div>
        </div>
      `;
    }

    // 4. SLIP GAJI (PAYROLL)
    function renderSlipGaji(p) {
      document.title = `Slip_Gaji_${p.nama_penerima}_${p.periode}`;
      document.getElementById('printContent').innerHTML = `
        <div class="letterhead">
          <div>
            <div class="brand-name">Roda<span>Kita</span> Rental</div>
            <div class="brand-sub">Sistem Penggajian Karyawan & Sopir</div>
          </div>
          <div class="doc-title-block">
            <div class="doc-type-title">SLIP GAJI</div>
            <div class="doc-number">Periode: ${p.periode}</div>
          </div>
        </div>

        <div class="grid-info">
          <div class="info-box">
            <h4>Data Penerima:</h4>
            Nama Lengkap: <b>${p.nama_penerima}</b><br>
            Jabatan / Peran: <b>${p.role_penerima}</b><br>
            Status: <b style="color:green;">${p.status_bayar.toUpperCase()}</b>
          </div>
          <div class="info-box" style="text-align:right;">
            <h4>Tanggal Pembayaran:</h4>
            ${p.tanggal_bayar || '-'}<br>
            Dicatat Oleh: ${p.dicatat_oleh || 'Akuntansi'}
          </div>
        </div>

        <table class="doc-table">
          <thead>
            <tr>
              <th>Komponen Gaji</th>
              <th class="text-right">Nominal</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Gaji Pokok</td>
              <td class="text-right">${formatRp(p.gaji_pokok)}</td>
            </tr>
            <tr>
              <td>Insentif Kinerja</td>
              <td class="text-right">${formatRp(p.insentif)}</td>
            </tr>
            <tr>
              <td>Bonus Perjalanan / Ritase</td>
              <td class="text-right">${formatRp(p.bonus_perjalanan)}</td>
            </tr>
            <tr>
              <td>Potongan Keterlambatan / Pinjaman</td>
              <td class="text-right" style="color:red;">-${formatRp(p.potongan)}</td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <th class="text-right" style="font-size:14px;">TOTAL GAJI BERSIH (TAKE HOME PAY)</th>
              <th class="text-right" style="font-size:16px; color:#0284c7;">${formatRp(p.total_diterima)}</th>
            </tr>
          </tfoot>
        </table>

        <div class="signatures">
          <div>
            Penerima
            <div class="sig-line"></div>
            ( <b>${p.nama_penerima}</b> )
          </div>
          <div>
            Bagian Keuangan & Akuntansi
            <div class="sig-line"></div>
            ( <b>RodaKita Rental</b> )
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
